<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经典贪吃蛇 - HTML5小游戏</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #2c3e50;
            font-family: 'Arial', sans-serif;
            color: white;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 24px;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        canvas {
            background-color: #ecf0f1;
            border: 4px solid #34495e;
            display: block;
        }

        #score-board {
            margin-top: 10px;
            font-size: 18px;
        }

        #start-btn {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #27ae60;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
        }

        #start-btn:hover {
            background-color: #2ecc71;
        }

        /* 游戏结束遮罩层 */
        #game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none; /* 默认隐藏 */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }
    </style>
</head>
<body>

    <h1>贪吃蛇大作战</h1>
    
    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="game-over-overlay">
            <h2>游戏结束!</h2>
            <p>最终得分: <span id="final-score">0</span></p>
        </div>
    </div>

    <div id="score-board">当前得分: <span id="score">0</span></div>
    <button id="start-btn" onclick="startGame()">开始游戏</button>

    <script>
        // 获取DOM元素
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const finalScoreElement = document.getElementById('final-score');
        const gameOverOverlay = document.getElementById('game-over-overlay');
        const startBtn = document.getElementById('start-btn');

        // 游戏配置
        const gridSize = 20; // 每个格子的大小
        const tileCount = canvas.width / gridSize; // 横纵格数 (20x20)
        
        // 游戏状态变量
        let score = 0;
        let snake = [];
        let food = { x: 15, y: 15 };
        let dx = 0; // X轴速度
        let dy = 0; // Y轴速度
        let gameInterval;
        let isGameRunning = false;

        // 初始化游戏数据
        function initGame() {
            snake = [
                { x: 10, y: 10 }, // 头
                { x: 9, y: 10 },
                { x: 8, y: 10 }   // 尾
            ];
            score = 0;
            dx = 1; // 默认向右移动
            dy = 0;
            scoreElement.innerText = score;
            createFood();
            gameOverOverlay.style.display = 'none';
            startBtn.style.display = 'none'; // 隐藏开始按钮
        }

        // 开始游戏
        function startGame() {
            if (isGameRunning) return;
            
            initGame();
            isGameRunning = true;
            
            // 启动游戏循环，每100毫秒刷新一次
            gameInterval = setInterval(gameLoop, 100);
        }

        // 游戏主循环
        function gameLoop() {
            if (hasGameEnded()) {
                endGame();
                return;
            }

            changeSnakePosition();
            clearCanvas();
            drawFood();
            drawSnake();
        }

        // 清空画布
        function clearCanvas() {
            ctx.fillStyle = '#ecf0f1';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // 绘制蛇
        function drawSnake() {
            snake.forEach((part, index) => {
                // 蛇头颜色深一点，身体浅一点
                ctx.fillStyle = index === 0 ? '#2c3e50' : '#3498db';
                ctx.strokeStyle = '#ecf0f1'; // 描边让格子分开
                
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
                ctx.strokeRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
            });
        }

        // 移动蛇的逻辑
        function changeSnakePosition() {
            // 计算新的蛇头位置
            const head = { x: snake.x + dx, y: snake.y + dy };
            
            // 将新头加入数组最前面
            snake.unshift(head);

            // 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                createFood();
                // 吃到食物不移除尾部，蛇变长
            } else {
                // 没吃到食物，移除尾部，保持长度不变
                snake.pop();
            }
        }

        // 生成食物
        function createFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            // 防止食物生成在蛇身上
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    createFood();
                }
            });
        }

        // 绘制食物
        function drawFood() {
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
        }

        // 碰撞检测
        function hasGameEnded() {
            const head = snake; // 注意：此时head已经是移动后的位置，但在changeSnakePosition中未做边界判断前

            // 1. 撞墙检测
            // 注意：这里检测的是snake，因为在changeSnakePosition里已经unshift了新头
            // 但为了逻辑清晰，我们在下一帧渲染前检测。
            // 实际上，应该在计算出新头后立即检测，或者检测当前头是否越界。
            // 修正：我们在changeSnakePosition后，snake是新位置。
            
            // 撞墙
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }

            // 撞自己 (从第4节身体开始检查，因为头不可能撞到颈部)
            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    return true;
                }
            }

            return false;
        }

        // 游戏结束处理
        function endGame() {
            clearInterval(gameInterval);
            isGameRunning = false;
            finalScoreElement.innerText = score;
            gameOverOverlay.style.display = 'flex';
            startBtn.style.display = 'block';
            startBtn.innerText = "重新开始";
        }

        // 键盘监听
        document.addEventListener('keydown', changeDirection);

        function changeDirection(event) {
            if (!isGameRunning) return;

            const LEFT_KEY = 37;
            const RIGHT_KEY = 39;
            const UP_KEY = 38;
            const DOWN_KEY = 40;

            const keyPressed = event.keyCode;
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            // 防止直接掉头
            if (keyPressed === LEFT_KEY && !goingRight) {
                dx = -1;
                dy = 0;
            }
            if (keyPressed === UP_KEY && !goingDown) {
                dx = 0;
                dy = -1;
            }
            if (keyPressed === RIGHT_KEY && !goingLeft) {
                dx = 1;
                dy = 0;
            }
            if (keyPressed === DOWN_KEY && !goingUp) {
                dx = 0;
                dy = 1;
            }
        }
        
        // 初始绘制一次背景
        clearCanvas();
    </script>
</body>
</html>
